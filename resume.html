<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Resume | Do Heon Kim</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="styles.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13c8ec",
            "background-light": "#f6f8f8",
            "background-dark": "#101f22",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: "Inter", sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-[#0d191b] dark:text-white transition-colors duration-300">
    <nav class="sticky top-0 z-50 w-full border-b border-[#e7f1f3] dark:border-white/10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
        <div class="max-w-[1100px] mx-auto px-6 h-16 flex items-center">
          <a
            href="index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d7e6ea] dark:border-white/10 bg-white/70 dark:bg-white/5 px-4 py-2 text-sm font-medium text-[#0d191b] dark:text-white transition hover:bg-white hover:border-[#b9d7de] dark:hover:bg-white/10"
          >
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span>Back to Home</span>
          </a>
        </div>
      </nav>

  <main class="max-w-[1100px] mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <section class="mb-10">
      <h1 class="text-4xl sm:text-5xl font-bold mb-4">Resume</h1>
      <p class="text-[#4c8d9a] dark:text-gray-400 text-base sm:text-lg">
        View or download my resume below.
      </p>
    </section>

    <section class="bg-white dark:bg-white/5 border border-[#cfe3e7] dark:border-white/10 rounded-2xl p-4 sm:p-6 shadow-sm">
      <div class="flex flex-wrap gap-4 mb-6">
        <a
          href="assets/Do_Heon_Kim_s_Resume.pdf"
          target="_blank"
          rel="noreferrer"
          class="contact-btn px-6 py-3 rounded-lg"
        >
          Open Resume
        </a>

        <a
          href="assets/Do_Heon_Kim_s_Resume.pdf"
          download
          class="contact-btn px-6 py-3 rounded-lg"
        >
          Download Resume
        </a>
      </div>

      <div class="rounded-xl overflow-hidden border border-[#cfe3e7] dark:border-white/10 bg-white">
        <iframe
          src="assets/Do_Heon_Kim_s_Resume.pdf"
          title="Do Heon Kim Resume"
          class="w-full h-[900px]"
        ></iframe>
      </div>
    </section>
  </main>
</body>
</html>
